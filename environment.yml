# conda env create -f environment.yml   (then: conda activate GeoData)
# Works on Windows, macOS and Linux. Everything heavy is compiled C/C++:
# Arrow (CSV parsing, Parquet), GDAL via pyogrio, GEOS via shapely 2, PROJ via pyproj.
name: GeoData
channels:
  - conda-forge
dependencies:
  - python>=3.11
  - numpy>=1.26
  - pandas>=2.1
  - pyarrow>=15
  - geopandas>=1.0
  - shapely>=2.0
  - pyogrio>=0.8
  - pyproj>=3.6
  - requests>=2.31
  - pyyaml>=6
  - xarray>=2024.1
  - netcdf4
  - h5netcdf
  - openpyxl
  - odfpy
  - python-calamine
  # later sections (collation, feature creation, visualisation)
  - scipy
  - rasterio
  - scikit-learn
  - matplotlib
  - libpysal
  - networkx
  - h3-py                # Uber H3 hexagons for the choropleths
  - ipykernel
