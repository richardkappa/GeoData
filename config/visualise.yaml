# =============================================================================
# Section 4 - visualisations (HTML)
# -----------------------------------------------------------------------------
# python 04_visualise.py                    -> <data_dir>/viz/index.html (links to everything)
# python 04_visualise.py --only minimaps    -> viz/minimaps.html  (static 5 km mini maps)
# python 04_visualise.py --only interactive -> viz/interactive_<area>.html (feature explorer)
# =============================================================================

global:
  data_dir: data
  output_dir: viz            # under data_dir (git-ignored)
  # Background tiles for the street maps. The pages are local files: OpenStreetMap's own
  # tile servers refuse them and CARTO needs an API key. CARTO is used when the
  # environment variable CARTO_API_KEY is set (free key: carto.com/basemaps/apikey; never
  # put the key itself in this file), otherwise Esri's tiles, which need no key.
  basemaps:
    streets: {url: 'https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png?key={key}', key_env: CARTO_API_KEY,
              attribution: '&copy; OpenStreetMap contributors &copy; CARTO', max_zoom: 19, fallback: esri_streets}
    light:   {url: 'https://basemaps.cartocdn.com/rastertiles/light_all/{z}/{x}/{y}.png?key={key}', key_env: CARTO_API_KEY,
              attribution: '&copy; OpenStreetMap contributors &copy; CARTO', max_zoom: 19, fallback: esri_light}

# --- derived postcode variables -----------------------------------------------
# Computed per postcode (pandas expression over `uses`) before area averages;
# `fill` gives values for missing inputs. Usable anywhere a variable is listed.
derived:
  temp_anomaly_c:
    expr: climate_temp_mean_c_avg - clim_mean_temp_c
    uses: [climate_temp_mean_c_avg, clim_mean_temp_c]
  rain_anomaly:
    expr: climate_rainfall_mm_avg / clim_precip_mm - 1
    uses: [climate_rainfall_mm_avg, clim_precip_mm]
  risk_index:     # 0-5: each component scaled to 0-1
    expr: (radon_class - 1) / 5 + (geosure_shrink_swell - 1) / 2 + (geosure_landslides - 1) / 2 + low_lying_near_river + (flood_high_cnt > 0)
    uses: [radon_class, geosure_shrink_swell, geosure_landslides, low_lying_near_river, flood_high_cnt]
    fill: {flood_high_cnt: 0, low_lying_near_river: 0}

# --- featured maps on the index page (links straight to a view) ---------------
featured:
  - {title: House prices against deprivation, href: 'choropleths.html#geo=msoa&var=hp_price_1000m_w0&cmp=imd_index_of_multiple_deprivation_imd_score&bg=0',
     text: 'Bivariate map: where prices are high despite deprivation, or low without it'}
  - {title: Five-year house price change, href: 'choropleths.html#geo=local_authorities&var=hp_change_1000m_w0_vs_w5',
     text: Change map centred on zero (blue = fall, red = rise)}
  - {title: Climate change since 1991-2020, href: 'choropleths.html#geo=grid_10km&var=temp_anomaly_c&bg=0&lines=0',
     text: 2023-25 temperatures against the 1991-2020 averages on 10 km squares}
  - {title: Drive time to A&E, href: 'choropleths.html#geo=grid_5km&var=drive_hospitals_ae_min&lines=0',
     text: Access to emergency care over the road network}
  - {title: Crime per 1,000 residents, href: 'cartograms.html#lay=4&var=crimes_per_1000_residents_1km',
     text: Hot spots adjusted for population, MSOA hexes}
  - {title: Similar places, href: 'choropleths.html#geo=msoa&var=cluster&bg=0',
     text: MSOAs grouped into 8 types by price, deprivation, crime, urbanness, access and climate}
  - {title: Environmental risk, href: 'choropleths.html#geo=grid_5km&var=risk_index&lines=0',
     text: Radon, ground stability, low-lying land by rivers and flood risk combined}
  - {title: Small multiples, href: small_multiples.html, text: Nine variables side by side on the same cartogram}
  - {title: Through-routes of central London, href: 'network_explorer.html#loc=St_Pauls&view=btw',
     text: Road centrality - which roads carry the shortest routes across the square}
  - {title: Bridges across the Thames, href: 'network_explorer.html#loc=St_Pauls&view=lsoa',
     text: The LSOA neighbour network with road bridges joining areas across the river}
  - {title: 15-minute walk from Bath Abbey, href: 'network_explorer.html#loc=Bath&view=walk',
     text: Walking time over the street network}

