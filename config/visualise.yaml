# --- static mini maps -------------------------------------------------------
# Every location as a size_m x size_m square. Layers are drawn in order.
# kind: polygon | line | point. `by` + `styles` style features by a column.
# show: false = unticked by default in the interactive explorer (minimap_explorer.html).
minimaps:
  size_m: 5000
  columns: 4                 # maps per row in the gallery
  dpi: 110
  sea_colour: '#cfe3f3'
  # explorer LSOA choropleth: uses the cartogram/choropleth variable list
  lsoa: {file: ons_boundaries/lsoa21_detail.parquet, fallback_file: ons_boundaries/lsoa21.parquet,
         key: lsoa21cd, name_col: lsoa21nm}
  layers:
    - {name: Land, show: false, file: ons_boundaries/countries.parquet, kind: polygon, style: {color: '#fbfaf5', edgecolor: '#7a9cb8', linewidth: 0.6}}
    - {name: Built-up area, show: false, file: os_open/builtupareas__os_open_built_up_areas.parquet, kind: polygon, style: {color: '#ece6dc'}}
    - {name: Foreshore, show: false, file: os_open/openzoomstack__foreshore.parquet, kind: polygon, style: {color: '#ede3c4'}}
    - {name: Greenspace, file: os_open/opengreenspace__greenspace_site.parquet, kind: polygon, style: {color: '#cfe8bf'}}
    - {name: Woodland, file: os_open/openzoomstack__woodland.parquet, kind: polygon, style: {color: '#b4d7a0'}}
    - {name: Ancient woodland, file: natural_england/ancient_woodland.parquet, kind: polygon, style: {color: '#86bd72'}}
    - {name: Lakes and rivers, file: os_open/openzoomstack__surfacewater.parquet, kind: polygon, style: {color: '#9cc7e8', zorder: 2}}
    - {name: Conservation area, file: historic_england/conservation_areas.parquet, kind: polygon, style: {color: none, edgecolor: '#8e5ea2', linewidth: 0.8, hatch: '////', alpha: 0.6}}
    - {name: Scheduled monument, file: historic_england/scheduled_monuments.parquet, kind: polygon, style: {color: '#d9b38c', edgecolor: '#8c5a2b', linewidth: 0.4}}
    - name: Water
      file: os_open/openrivers__watercourse_link.parquet
      kind: line
      by: form
      styles:                # lake outlines come from Zoomstack surface water; Open Rivers lake centre-lines not drawn
        inlandRiver: {color: '#4a90c8', linewidth: 1.1, zorder: 3}
        tidalRiver:  {color: '#4a90c8', linewidth: 1.6, zorder: 3}
        canal:       {color: '#2f6fa8', linewidth: 1.1, zorder: 3}
    - name: Roads
      file: os_open/openroads__road_link.parquet
      kind: line
      by: road_classification
      styles:
        Motorway:              {color: '#3b6fd1', linewidth: 2.6, zorder: 6}
        A Road:                {color: '#d9453a', linewidth: 1.8, zorder: 5}
        B Road:                {color: '#ef9a3c', linewidth: 1.3, zorder: 4}
        Classified Unnumbered: {color: '#9a9a9a', linewidth: 0.8, zorder: 3}
        Unclassified:          {color: '#b5b5b5', linewidth: 0.6, zorder: 3}
        Not Classified:        {color: '#c8c8c8', linewidth: 0.4, zorder: 3}
        Unknown:               {color: '#c8c8c8', linewidth: 0.4, zorder: 3}
    - {name: Railway, file: os_open/openzoomstack__rail.parquet, kind: line, style: {color: '#333333', linewidth: 1.4, zorder: 6}}
    - {name: Listed building, file: historic_england/listed_buildings.parquet, kind: point, style: {color: '#a3203a', s: 3, zorder: 7}}
    - {name: Railway station, file: naptan/naptan_stops.parquet, kind: point, filter: {stoptype: RLY}, style: {color: '#111111', marker: s, s: 26, zorder: 8}}

# --- hex cartograms ---------------------------------------------------------
# Postcode values averaged to each area (weighted by addresses; `agg: sum` to
# add up instead) and drawn as equal hexagons. Layouts from Open Innovations'
# hexmaps (https://hexmap.uk, MIT licence); `code` is the lookup column the
# layout's hex keys match.
cartograms:
  layouts:
    constituencies:
      label: Westminster constituencies (2024)
      url: https://raw.githubusercontent.com/odileeds/hexmaps/gh-pages/maps/uk-constituencies-2023.hexjson
      code: pcon24cd
    local_authorities:
      label: Local authorities
      url: https://raw.githubusercontent.com/odileeds/hexmaps/gh-pages/maps/uk-local-authority-districts-2025.hexjson
      code: lad26cd
    os_equal_area_2019:
      label: Local authorities, equal-area squares (OS, 2019 districts)
      type: gpkg_squares     # Ordnance Survey equal-area cartogram (OGL v3)
      url: https://raw.githubusercontent.com/OrdnanceSurvey/equal-area-cartogram/master/local-authority-district/data/geopackage/lad-cartogram-square-2019.gpkg
      layer: square
      key: lad_code
      name_col: lad_name
      outlines: [region_outline, country_outline]
      code: lad19cd          # postcode -> 2019 district via the ons_boundaries lad19 polygon join
    nhs_pcn:
      label: NHS Primary Care Networks, England (postcode -> PCN of nearest GP practice)
      url: https://raw.githubusercontent.com/odileeds/hexmaps/gh-pages/maps/nhs-pcn-2022.hexjson
      name_key: name         # this layout keeps the name in `name` (`n` is a sequence number)
      code: nearest_gp_pcn_code   # from 03_features.py (assign group)
    msoa:
      label: MSOAs, England and Wales (7,264 hexes)
      type: geojson_polygons
      url: https://hexmap.uk/layouts/files/msoa-2021.geojson
      feature_type: hex
      key: id
      name_col: n
      scale: 0.001           # GeoJSON units -> drawing units
      code: msoa21cd
  # label, or {label, scale: diverging (change maps, centred on 0), agg: sum}
  variables: &area_variables
    # people, prices, deprivation
    hp_price_1000m_w0:                            Typical house price, latest 12 months (£)
    imd_index_of_multiple_deprivation_imd_score:  Deprivation score (IMD 2025, England)
    uprn_count:                                   {label: Addresses, agg: sum}
    # change maps (blue = fall, red = rise)
    hp_change_1000m_w0_vs_w1:                     {label: House price change over 1 year (fraction), scale: diverging}
    hp_change_1000m_w0_vs_w3:                     {label: House price change over 3 years (fraction), scale: diverging}
    hp_change_1000m_w0_vs_w5:                     {label: House price change over 5 years (fraction), scale: diverging}
    crime_change_12m_total:                       {label: Change in recorded crime, latest 12 months vs previous 12 (fraction), scale: diverging}
    climate_temp_change_2025_c:                   {label: 2025 mean temperature vs 2023-24 (°C), scale: diverging}
    temp_anomaly_c:                               {label: 'Climate change: 2023-25 mean temperature vs 1991-2020 (°C)', scale: diverging}
    rain_anomaly:                                 {label: 'Climate change: 2023-25 rainfall vs 1991-2020 (fraction)', scale: diverging}
    # hot spots adjusted for population
    crimes_per_1000_residents_1km:                {label: Crimes within 1 km per 1,000 residents (England and Wales), countries: [E, W]}
    violent_crime_per_1000_residents_1km:         Violent crime within 1 km per 1,000 residents
    burglary_per_100_households_1km:              Burglaries within 1 km per 100 households
    collisions_per_1000_residents_1km:            {label: Road collisions within 1 km per 1,000 residents (England and Wales), countries: [E, W]}
    takeaways_per_10000_residents_1km:            Takeaways within 1 km per 10,000 residents
    # travel times (access)
    walk_rail_stations_min:                       {label: Walking time to nearest railway station (minutes), countries: [E, W, S]}
    walk_gp_practices_min:                        {label: Walking time to nearest GP practice (minutes; England and Wales), countries: [E, W]}
    walk_supermarkets_min:                        Walking time to nearest supermarket (minutes)
    walk_secondary_schools_min:                   {label: Walking time to nearest secondary school (minutes; England), countries: [E]}
    drive_hospitals_ae_min:                       {label: Drive time to nearest A&E (minutes; England), countries: [E]}
    drive_motorway_junctions_min:                 {label: Drive time to nearest motorway junction (minutes; Great Britain), countries: [E, W, S]}
    # connectivity and energy
    bb_gigabit_availability_premises:             Gigabit broadband available (% premises)
    bb_of_premises_below_the_uso:                 Premises below the broadband USO (%)
    mob_4g_indoor_all_operators_pct:              Indoor 4G from all operators (% premises)
    mob_5g_outdoor_any_operator_pct:              Outdoor 5G from any operator (% premises)
    gas_median_cons_kwh:                          Median household gas use (kWh / year)
    electricity_median_cons_kwh:                  Median household electricity use (kWh / year)
    # environment and risk
    risk_index:                                   'Environmental risk index (0-5: radon, shrink-swell, landslide, low-lying by a river, high flood risk)'
    flood_high_cnt:                               Properties at high flood risk (EA, England)
    radon_class:                                  Radon potential class (1-6)
    dist_coast_m:                                 Distance to the coast (m)
    elevation_m:                                  Height above sea level (m)
    share_greenspace_500m:                        Greenspace within 500 m (share of area)
    # climate
    climate_rainfall_mm_avg:                      Annual rainfall, 2023-25 average (mm)
    climate_sunshine_hours_avg:                   Annual sunshine, 2023-25 average (hours)
    climate_temp_mean_c_avg:                      Mean temperature, 2023-25 average (°C)
    climate_snow_lying_days_avg:                  Days with snow lying, 2023-25 average
  # several variables side by side on the same cartogram (small_multiples.html)
  small_multiples:
    layouts: [local_authorities, constituencies, msoa]
    variables: [hp_price_1000m_w0, hp_change_1000m_w0_vs_w5, imd_index_of_multiple_deprivation_imd_score,
                crimes_per_1000_residents_1km, bb_gigabit_availability_premises, drive_hospitals_ae_min,
                temp_anomaly_c, risk_index, climate_rainfall_mm_avg]

# --- geographic choropleths ---------------------------------------------------
# The same variables averaged to real boundaries (ONS Open Geography, already
# extracted by 01_extract.py) and to Ordnance Survey national grid squares.
choropleths:
  boundaries:
    constituencies:    {label: Westminster constituencies (2024), file: ons_boundaries/westminster_2024.parquet,
                        key: pcon24cd, name_col: pcon24nm, code: pcon24cd, simplify_m: 100}
    local_authorities: {label: Local authorities, file: ons_boundaries/lad.parquet,
                        key: lad26cd, name_col: lad26nm, code: lad26cd, simplify_m: 150}
    msoa:              {label: MSOAs (England and Wales), file: ons_boundaries/msoa21.parquet,
                        key: msoa21cd, name_col: msoa21nm, code: msoa21cd, simplify_m: 40}
  grid_km: [2.5, 5, 10, 25, 50]   # OS national grid squares built from postcode coordinates
  variables: *area_variables
  # "similar places": k-means clusters of areas on these (standardised) averages,
  # each cluster labelled by its two most distinctive variables (`short` names)
  clusters:
    label: 'Area type: clusters of similar areas'
    geographies: [msoa, local_authorities, constituencies]
    k: 8
    variables:
      hp_price_1000m_w0:                           {label: house price, short: house prices}
      imd_index_of_multiple_deprivation_imd_score: {label: deprivation, short: deprivation}
      crimes_per_1000_residents_1km:               {label: crime rate, short: crime, countries: [E, W]}
      share_built_up_2km:                          {label: built-up share, short: urban}
      bb_gigabit_availability_premises:            {label: gigabit broadband, short: gigabit broadband}
      walk_rail_stations_min:                      {label: walk to station, short: walk to station, countries: [E, W, S]}
      drive_hospitals_ae_min:                      {label: drive to A&E, short: drive to A&E, countries: [E]}
      climate_rainfall_mm_avg:                     {label: rainfall, short: rainfall}
      elevation_m:                                 {label: elevation, short: elevation}
      gas_median_cons_kwh:                         {label: gas use, short: gas use}

# --- network explorer -------------------------------------------------------
# Road and area networks around every location (network_explorer.html)
networks:
  size_m: 5000
  route_pad_m: 1500            # roads this far beyond the square are used for routing
  betweenness_sources: 200     # sampled start points for road centrality
  walk_kmh: 4.8
  speeds_kmh: {}               # override drive speeds by road class, e.g. {A Road: 60}
  roads: os_open/openroads__road_link.parquet
  # the generalised LSOAs (same as the features' neighbour averages) are clipped to the
  # coast and the larger rivers, so areas across the Thames do not touch and the road
  # "bridges" show; the full-resolution file extends to mid-river so every bank touches
  lsoa: ons_boundaries/lsoa21.parquet

# --- heat maps ----------------------------------------------------------------
# Point datasets named in config/features.yaml (`points:`), counted in national
# grid cells and drawn as a heat layer. name: label | {label, note}
heatmaps:
  cell_m: 500
  datasets:
    crimes:            {label: All recorded crime, note: police street-level crime over the extracted period}
    burglary:          Burglary
    antisocial:        Anti-social behaviour
    vehicle_crime:     Vehicle crime
    stop_search:       Stop and search
    collisions:        {label: Road collisions, note: STATS19 collisions over the extracted years}
    collisions_ksi:    Road collisions - fatal or serious
    listed_buildings:  Listed buildings (England)
    property_sales:    {label: House sales, note: Land Registry sales over the extracted period}
    takeaways:         Takeaways and sandwich shops
    pubs_bars:         Pubs, bars and nightclubs
    restaurants_cafes: Restaurants and cafes
    supermarkets:      Supermarkets
    schools:           Schools
    gp_practices:      GP practices
    care_homes:        Care homes
    bus_stops:         Bus stops
  # rates per head: points (from the datasets above) and people counted in grid
  # squares, both summed over a window of squares to steady the rate. `per` is
  # residents or households (Census 2021, England and Wales) or addresses (UPRNs, GB)
  rates:
    cell_m: 2000
    smooth_cells: 3            # 3 x 3 squares = 6 km window
    min_population: 1000
    datasets:
      collisions:        {label: 'Road collisions per 1,000 residents', per: residents, scale: 1000, note: 'Collisions over the 5 years extracted (STATS19).'}
      collisions_ksi:    {label: 'Fatal or serious road collisions per 1,000 residents', per: residents, scale: 1000, note: 'Collisions over the 5 years extracted (STATS19).'}
      crimes:            {label: 'Recorded crime per 1,000 residents', per: residents, scale: 1000, note: 'Crimes over the 24 months extracted; city centres score high partly because of visitors.'}
      burglary:          {label: 'Burglaries per 100 households', per: households, scale: 100, note: 'Over the 24 months extracted.'}
      vehicle_crime:     {label: 'Vehicle crime per 1,000 residents', per: residents, scale: 1000, note: 'Over the 24 months extracted.'}
      antisocial:        {label: 'Anti-social behaviour per 1,000 residents', per: residents, scale: 1000, note: 'Over the 24 months extracted.'}
      takeaways:         {label: 'Takeaways per 10,000 residents', per: residents, scale: 10000}
      pubs_bars:         {label: 'Pubs and bars per 10,000 residents', per: residents, scale: 10000}
      gp_practices:      {label: 'GP practices per 10,000 residents', per: residents, scale: 10000}
      listed_buildings:  {label: 'Listed buildings per 100 addresses', per: addresses, scale: 100}
      property_sales:    {label: 'House sales per 100 addresses', per: addresses, scale: 100, note: 'Standard sales since January 2020.'}

# --- interactive feature explorer -------------------------------------------
# One HTML page per area: every postcode in the square as a dot on a street
# map, coloured by the chosen feature (drop-down), hover for all values.
interactive:
  size_m: 5000
  areas: [South_London, Birmingham, Bath, York, Edinburgh, Windermere, St_Ives]
  # column: label (columns come from postcode_features.parquet or postcode_lookup.parquet)
  variables:
    hp_price_1000m_w0:                            Typical house price within 1 km, latest 12 months (£)
    hp_change_1000m_w0_vs_w5:                     House price change over 5 years (fraction)
    lr_median_price:                              Median sale price in the postcode (£)
    imd_index_of_multiple_deprivation_imd_score:  Deprivation score (IMD 2025, England; higher = more deprived)
    crimes_per_1000_residents_1km:                {label: Crimes within 1 km per 1,000 residents (England and Wales), countries: [E, W]}
    bb_gigabit_availability_premises:             Gigabit broadband available (% of premises)
    gas_median_cons_kwh:                          Median household gas use (kWh / year)
    walk_rail_stations_min:                       {label: Walking time to nearest railway station (minutes), countries: [E, W, S]}
    walk_gp_practices_min:                        {label: Walking time to nearest GP practice (minutes; England and Wales), countries: [E, W]}
    dist_greenspace_m:                            Distance to nearest greenspace (m; 0 = inside)
    dist_coast_m:                                 Distance to the coast (m)
    climate_rainfall_mm_avg:                      Annual rainfall, 2023-25 average (mm)
    climate_sunshine_hours_avg:                   Annual sunshine, 2023-25 average (hours)
    climate_temp_mean_c_avg:                      Mean temperature, 2023-25 average (°C)
    uprn_count:                                   Addresses in the postcode
