# =============================================================================
# Section 4 - visualisations (HTML)
# -----------------------------------------------------------------------------
# python 04_visualise.py                    -> <data_dir>/viz/index.html (links to everything)
# python 04_visualise.py --only minimaps    -> viz/minimaps.html  (static 5 km mini maps)
# python 04_visualise.py --only interactive -> viz/interactive_<area>.html (feature explorer)
# =============================================================================

global:
  data_dir: data
  output_dir: viz            # under data_dir (git-ignored)
  # Background tiles for the street maps. The pages are local files: OpenStreetMap's own
  # tile servers refuse them and CARTO needs an API key. CARTO is used when the
  # environment variable CARTO_API_KEY is set (free key: carto.com/basemaps/apikey; never
  # put the key itself in this file), otherwise Esri's tiles, which need no key.
  basemaps:
    streets: {url: 'https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png?key={key}', key_env: CARTO_API_KEY,
              attribution: '&copy; OpenStreetMap contributors &copy; CARTO', max_zoom: 19, fallback: esri_streets}
    light:   {url: 'https://basemaps.cartocdn.com/rastertiles/light_all/{z}/{x}/{y}.png?key={key}', key_env: CARTO_API_KEY,
              attribution: '&copy; OpenStreetMap contributors &copy; CARTO', max_zoom: 19, fallback: esri_light}

