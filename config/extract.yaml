# =============================================================================
# Section 1 - data extraction configuration
# -----------------------------------------------------------------------------
# Turn sources on/off with `enabled`, and tune what each one pulls with its
# parameters. Run everything enabled with:   python 01_extract.py
# Or pick sources on the command line:       python 01_extract.py --only ons_nspl police
# List sources:                              python 01_extract.py --list
#
# Outputs: <data_dir>/extract/<source>/*.parquet   (GeoParquet for shapes, EPSG:27700)
# Cache:   <data_dir>/raw/<source>/                (downloads, reused on re-runs)
# Keys:    postcode_ns (postcode, upper case, no spaces), uprn, or ONS area codes
#          (oa21cd / lsoa21cd / msoa21cd ...) which the NSPL maps to postcodes.
# =============================================================================

global:
  data_dir: data          # relative to the repo, or absolute e.g. /path/to/GeoData. Env GEODATA_DIR overrides
  crs: EPSG:27700         # British National Grid for every output geometry / easting-northing
  threads: 4              # parallel HTTP requests for paged APIs (I/O bound, not CPU)
  timeout: 120            # seconds per HTTP request
  force: false            # true = re-download even when the file is cached
  reprocess: false        # true = rebuild parquet outputs from cached downloads
  keep_raw: true          # false = delete large raw downloads after processing

sources:

  # --- ONS postcode & address spine ------------------------------------------
  ons_nspl:               # ~185 MB zip -> ~2.7m postcodes, all geographies, coords
    enabled: true
    include_terminated: true      # keep terminated postcodes (needed to match old sales/crimes)
    columns:                      # null = keep every NSPL column
      - oa21cd
      - lsoa21cd
      - msoa21cd
      - lad26cd
      - wd26cd
      - ctry26cd
      - rgn26cd
      - pcon24cd
      - npark16cd
      - bua24cd
      - ruc21ind
      - oac21ind
      - imd25ind
      - pfa23cd
      - icb26cd
      - ttwa15cd
      - itl25cd

  ons_nsul:               # UPRN -> postcode + geographies. ~560 MB zip, ~42m rows
    enabled: false
    regions: null                 # e.g. [LN, SE] to limit to some regions (file suffixes)
    columns: [oa21cd, lsoa21cd, msoa21cd, lad26cd]   # null = all

  ons_boundaries:         # ArcGIS feature services under ONS Open Geography
    enabled: true
    layers:
      # name: exact service | {service_regex: newest match} | {url: full layer url}
      lsoa21: LSOA_2021_EW_BSC_V4_RUC
      msoa21: MSOA_2021_EW_BSC_V3_RUC
      oa21:   {service: OA_2021_EW_BGC_V2_RUC, enabled: false}     # 189k polygons
      lad:    {service_regex: '^Local_Authority_Districts_.*_Boundaries_UK_BGC$'}
      countries: {service_regex: '^Countries_December_\d{4}_Boundaries_UK_BGC$'}
      regions:   {service_regex: '^Regions_December_\d{4}_Boundaries_EN_BGC$'}
      national_parks: National_Parks_December_2022_Boundaries_GB_BGC_V4
      westminster_2024: Westminster_Parliamentary_Constituencies_July_2024_Boundaries_UK_BGC
      wards:    {service_regex: '^Wards_(May|December)_\d{4}_Boundaries_UK_BGC$', enabled: false}
      built_up_areas_2024: {service: main_ONS_BUA_2024_EW_V2, enabled: false}
      police_force_areas: {service_regex: '^Police_Force_Areas_De[a-z]*_\d{4}_EW_BGC$', enabled: false}

  # --- Census & deprivation ---------------------------------------------------
  census_2021:            # Nomis bulk topic summaries, England & Wales
    enabled: true
    levels: [oa]                  # any of oa, lsoa, msoa, ltla, utla, rgn, ctry
    tables:                       # "all" for every TS table (~70 zips, ~1 GB)
      - TS001   # residence type
      - TS003   # household composition
      - TS006   # population density
      - TS007A  # age by five-year bands
      - TS017   # household size
      - TS021   # ethnic group
      - TS037   # general health
      - TS038   # disability
      - TS044   # accommodation type
      - TS045   # car or van availability
      - TS054   # tenure
      - TS061   # method of travel to work
      - TS062   # NS-SeC
      - TS066   # economic activity
      - TS067   # highest qualification
      - TS046   # central heating

  imd_england:
    enabled: true
    years: [2025]                 # add 2019 for comparison (LSOA 2011 codes)

  # --- Crime & safety ---------------------------------------------------------
  police:                 # data.police.uk archive ~1.7 GB (36 months, all forces)
    enabled: true
    archive: latest               # or "YYYY-MM"
    months: 12                    # how many months back from the archive month to keep
    datasets: [street, stop-and-search]   # also: outcomes

  road_safety:            # STATS19
    enabled: true
    years: last-5-years           # or [2022, 2023, 2024] or "1979-latest-published-year"
    tables: [collision]           # also: vehicle, casualty

  # --- Transport --------------------------------------------------------------
  naptan:
    enabled: true
    active_only: true
    stop_types: null              # e.g. [RLY, BCT, FER, TMU, AIR]; null = all

  # --- Postcode-level datasets ------------------------------------------------
  land_registry:          # Price Paid; each year ~150 MB, complete ~5 GB
    enabled: true
    years: [2024, 2025, 2026]     # or "complete"

  schools:
    enabled: true
    open_only: true
    columns: [establishmentname, typeofestablishment_name, establishmenttypegroup_name,
              phaseofeducation_name, statutorylowage, statutoryhighage, gender_name,
              religiouscharacter_name, admissionspolicy_name, schoolcapacity, numberofpupils,
              percentagefsm, ofstedrating_name, ofstedlastinsp, urbanrural_name, la_name]

  energy_postcode:        # DESNZ postcode-level domestic electricity & gas
    enabled: true
    year: latest

  # --- Ordnance Survey / BGS --------------------------------------------------
  os_open:
    enabled: true
    products:
      CodePointOpen:  {format: CSV}                       # postcode centroids (GB) 14 MB
      OpenGreenspace: {format: GeoPackage}                 # parks, playing fields, access points
      OpenRivers:     {format: GeoPackage}
      BuiltUpAreas:   {format: GeoPackage}
      Radon_Indicative_Atlas: {format: GeoPackage, area: GB}   # BGS/UKHSA radon potential
      GB-Hex-5km-GeoSure:     {format: GeoPackage}             # BGS ground stability hazards
      OpenRoads:      {format: GeoPackage, layers: [road_link, motorway_junction], enabled: false}  # 1 GB
      OpenUPRN:       {format: CSV, enabled: false}       # 620 MB zip, 41m UPRN coordinates
      OpenNames:      {format: CSV, enabled: false}
      Terrain50:      {format: ASCII Grid, process: false, enabled: false}  # 50 m DTM, raw only

  # --- Environment, heritage, climate -----------------------------------------
  natural_england:
    enabled: true
    simplify_m: 5                 # server-side generalisation in metres (null = full detail, ~5x bigger)
    layers:
      sssi: SSSI_England
      aonb: Areas_of_Outstanding_Natural_Beauty_England
      ancient_woodland: Ancient_Woodland_England
      local_nature_reserves: Local_Nature_Reserves_England
      national_nature_reserves: National_Nature_Reserves_England
      special_areas_of_conservation: Special_Areas_of_Conservation_England
      special_protection_areas: Special_Protection_Areas_England
      ramsar: Ramsar_England
      country_parks: Country_Parks_England
      heritage_coasts: Heritage_Coasts_England
      priority_habitats: {service: Priority_Habitats_Inventory_England, enabled: false}   # very large

  historic_england:
    enabled: true
    simplify_m: 2
    layers:
      listed_buildings: {service: National_Heritage_List_for_England_NHLE_v02_VIEW, layer: 0}
      scheduled_monuments: {service: National_Heritage_List_for_England_NHLE_v02_VIEW, layer: 6}
      parks_and_gardens: {service: National_Heritage_List_for_England_NHLE_v02_VIEW, layer: 7}
      battlefields: {service: National_Heritage_List_for_England_NHLE_v02_VIEW, layer: 8}
      world_heritage_sites: {service: National_Heritage_List_for_England_NHLE_v02_VIEW, layer: 10}
      conservation_areas: Conservation_Areas

  metoffice_cdp:          # open 1991-2020 climate averages
    enabled: true
    layers:
      airfrost_days: Annual_Count_of_Airfrost_Days_1991_2020
      icing_days: Annual_Count_of_Icing_Days_1991_2020
      summer_days: Annual_Count_of_Summer_Days_1991_2020
      rain_days_10mm: Annual_Count_of_10mm_Rain_Days_1991_2020
      precipitation_12km: Annual_Precipitation_Observations_1991_2020
      temperature_12km: Annual_Temperature_Observations_1991_2020
      max_temperature_12km: Annual_Max_Temperature_Observations_1991_2020
      min_temperature_12km: Annual_Min_Temperature_Observations_1991_2020

  metoffice_haduk:        # needs env CEDA_TOKEN (free CEDA account)
    enabled: false
    version: latest
    resolution: 1km
    frequency: ann                # ann | seas | mon
    years: [2023, 2024, 2025]
    variables: [rainfall, tas, tasmax, tasmin, sun, groundfrost, airfrost, snowLying, sfcWind, hurs]
